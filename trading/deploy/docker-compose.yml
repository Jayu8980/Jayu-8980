# Paper trading on one machine: Redis Streams bus, Postgres state, the daily service.
# From the trading/ directory:
#   cp .env.example deploy/.env   # then fill in the secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
# The mounted config directory must set stage: paper, bus.backend: redis_streams and
# state.backend: postgres (see docs/OPERATIONS.md).
name: aitrader

services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aitrader
      POSTGRES_DB: aitrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aitrader"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  paper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: [.env]
    environment:
      AITRADER_REDIS_URL: redis://redis:6379/0
      AITRADER_POSTGRES_DSN: postgresql://aitrader:${POSTGRES_PASSWORD}@postgres/aitrader
      TZ: Asia/Kolkata
    volumes:
      - ${AITRADER_CONFIG_DIR:-../config}:/app/config:ro
      - ../data:/app/data
      - ../run:/app/run
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  redis:
  postgres:
