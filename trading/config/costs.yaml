    sebi_fee: 0.000001
    stamp_duty_buy:
      equity_delivery: 0.00015
      equity_intraday: 0.00003
      futures: 0.00002
      options: 0.00003
    gst: 0.18
    brokerage:
      equity_delivery: {pct: 0.0, cap: 0.0}
      equity_intraday: {pct: 0.0003, cap: 20.0}
      futures: {pct: 0.0003, cap: 20.0}
      options_flat: 20.0

