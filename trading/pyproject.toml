[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aitrader"
version = "0.1.0"
description = "Institutional-grade multi-agent AI trading system (NSE cash + F&O)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<0.16",
    "arch>=7.0,<9",
    "duckdb>=1.1,<3",
    "anthropic>=1.0,<3",
]

[project.optional-dependencies]
# Durable backends for the paper and live stages (Redis Streams bus, Postgres state).
infra = [
    "redis>=5,<9",
    "psycopg[binary]>=3.1,<4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pydantic.warnings.PydanticDeprecatedSince20"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["UP007"]  # Union[...] is kept for the discriminated payload union

[tool.ruff.lint.per-file-ignores]
"src/aitrader/agents/*/__init__.py" = ["E501"]

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "arch.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["aitrader"]
