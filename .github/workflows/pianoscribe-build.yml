# Builds PianoScribe (the offline piano transcription app in PianoScribe/).
# Every push that touches PianoScribe/ runs the core unit tests and builds debug + release APKs,
# attached to the run as downloadable artifacts. A tag like pianoscribe-v1.0.0, or a manual run with
# release_tag set (Actions -> Build PianoScribe APK -> Run workflow), also publishes a GitHub Release
# with the APKs as direct downloads.
#
# Optional repository secrets for a properly signed release APK (same names as the AutoTube build):
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# Without them the release APK is signed with the CI debug key (still installable).
name: Build PianoScribe APK

on:
  push:
    branches: ["**"]
    tags: ["pianoscribe-v*"]
    paths: ["PianoScribe/**", ".github/workflows/pianoscribe-build.yml"]
  pull_request:
    paths: ["PianoScribe/**", ".github/workflows/pianoscribe-build.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with the APKs under this tag (e.g. pianoscribe-v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pianoscribe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: PianoScribe

jobs:
  # Converts the high-resolution piano transcription model (ByteDance, Kong et al. 2021) to ONNX,
  # checks it against PyTorch, and writes reference transcriptions of the evaluation set.
  # Cached: it only reruns when the script or the evaluation set changes.
  piano-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        id: cache
        with:
          path: PianoScribe/piano-model-out
          key: piano-model-v1-${{ hashFiles('PianoScribe/scripts/piano_model/**', 'PianoScribe/eval/**') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Download, export and check the model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet piano_transcription_inference==0.0.6 torchlibrosa==0.1.0 librosa==0.10.2.post1 soundfile onnx==1.17.0 onnxruntime==1.20.1 "numpy<2"
          curl -sSL --retry 3 -o ckpt.pth "https://zenodo.org/record/4034264/files/CRNN_note_F1%3D0.9677_pedal_F1%3D0.9186.pth?download=1"
          ls -la ckpt.pth
          python scripts/piano_model/export_and_reference.py ckpt.pth eval piano-model-out
          # Basic Pitch's ONNX model, for the comparison.
          pip download --quiet --no-deps basic-pitch==0.4.0 -d bp
          unzip -q -o bp/*.whl 'basic_pitch/saved_models/icassp_2022/nmp.onnx' -d bp
          cp bp/basic_pitch/saved_models/icassp_2022/nmp.onnx piano-model-out/basic_pitch.onnx
          ls -la piano-model-out

      - uses: actions/upload-artifact@v4
        with:
          name: piano-model
          path: PianoScribe/piano-model-out
          retention-days: 7

  transkun-model:
    # Transkun 2.0 (MIT): accuracy on the evaluation set, ONNX export and a check of the
    # decomposed pipeline the app would use. Not bundled yet: only measured.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: PianoScribe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        id: cache
        with:
          path: PianoScribe/transkun-out
          key: transkun-v1-${{ hashFiles('PianoScribe/scripts/transkun/**', 'PianoScribe/eval/**') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Evaluate, export and check Transkun
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --no-deps transkun==2.0.1
          pip install --quiet moduleconf pretty_midi mir_eval soundfile scipy onnx==1.17.0 onnxruntime==1.20.1 "numpy<2"
          set -o pipefail
          python scripts/transkun/export_and_eval.py eval transkun-out 2>&1 | grep -E "^TK|Error|error|Traceback|File " | tee transkun.log
          ls -la transkun-out

      - uses: actions/upload-artifact@v4
        with:
          name: transkun-model
          path: PianoScribe/transkun-out
          retention-days: 7

  transkun-eval:
    # The Kotlin port of Transkun against the official pipeline, and its accuracy as the app runs it.
    needs: [piano-model, transkun-model]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: piano-model
          path: PianoScribe/piano-model-out
      - uses: actions/download-artifact@v4
        with:
          name: transkun-model
          path: PianoScribe/transkun-out
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Transkun port check and accuracy
        env:
          TRANSKUN_DIR: ${{ github.workspace }}/PianoScribe/transkun-out
          BASIC_PITCH_ONNX: ${{ github.workspace }}/PianoScribe/piano-model-out/basic_pitch.onnx
          EVAL_DATA: ${{ github.workspace }}/PianoScribe/piano-model-out
          EVAL_TRUTH: ${{ github.workspace }}/PianoScribe/eval
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon :core:test --tests '*TranskunEval*' -Dorg.gradle.jvmargs=-Xmx4g 2>&1 | grep -E "TK|FAIL|BUILD|Exception|expected" | tee tk-eval.log

  build:
    needs: piano-model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: piano-model
          path: PianoScribe/piano-model-out

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform 36 and build tools
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accuracy of the transcription models on the evaluation set
        env:
          PIANO_ONNX: ${{ github.workspace }}/PianoScribe/piano-model-out/piano_fp32.onnx
          BASIC_PITCH_ONNX: ${{ github.workspace }}/PianoScribe/piano-model-out/basic_pitch.onnx
          EVAL_DATA: ${{ github.workspace }}/PianoScribe/piano-model-out
          EVAL_TRUTH: ${{ github.workspace }}/PianoScribe/eval
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :core:test --tests '*PianoModelEval*' 2>&1 | grep -E "EVAL|PARITY|RESULT|FALSEPOS|FAIL|BUILD" || true

      - name: Bundle the piano model
        run: |
          mkdir -p app/src/main/assets/models
          cp piano-model-out/piano_fp32.onnx app/src/main/assets/models/piano_transcription.onnx
          ls -la app/src/main/assets/models

      - name: Decode release keystore (if provided)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, debug and release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/pianoscribe-v') && github.ref_name) || '' }}
        run: |
          # pianoscribe-v1.2.0 -> versionName 1.2.0
          if [ -n "$RELEASE_TAG" ]; then export VERSION_NAME="${RELEASE_TAG#pianoscribe-v}"; fi
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue :core:test assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Show compile errors (on failure)
        if: failure()
        run: |
          echo "### Build errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(e: |ERROR:|.*error:|\[ksp\].*(error|Error)|.*FAILED)" build.log | sed 's#file:///home/runner/work/[^ ]*/PianoScribe/##' | sort -u | head -300 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report 16 KB page alignment of native libraries
        run: |
          mkdir -p so-check && cd so-check
          unzip -o -q ../app/build/outputs/apk/release/*.apk 'lib/*'
          for f in lib/*/*.so; do
            echo "$f LOAD align: $(readelf -lW "$f" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')"
          done
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 ../app/build/outputs/apk/release/*.apk | grep -E "lib/|Verification" || true

      - name: Verify no INTERNET permission
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          # Fully offline: no internet or network-state permission may reach the APK.
          if "$AAPT" dump permissions app/build/outputs/apk/release/*.apk | grep -qE "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)"; then
            echo "A network permission was found in the APK"; exit 1
          fi
          "$AAPT" dump permissions app/build/outputs/apk/release/*.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/PianoScribe-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/PianoScribe-release.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PianoScribe-apks
          path: PianoScribe/dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PianoScribe-test-reports
          path: PianoScribe/core/build/reports/tests/

      - name: Keep the release APK for the device-test job
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-for-tests
          path: PianoScribe/app/build/outputs/apk/release/*.apk
          retention-days: 1

  # Runs the app for real on an Android emulator: the pipeline tests (decode, TFLite model, Room,
  # playback, every export, compare/auto-fix), a UI smoke test, and a launch check of the
  # minified release APK.
  device-tests:
    needs: [build, piano-model]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 36 = Android 16, the newest phones; 34 = Android 14.
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner starts with ~14 GB free; the Android 14 image plus its 6 GB userdata
      # partition and the Gradle build do not fit without clearing unused toolchains.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: piano-model
          path: PianoScribe/piano-model-out

      - name: Bundle the piano model
        run: |
          mkdir -p app/src/main/assets/models
          cp piano-model-out/piano_fp32.onnx app/src/main/assets/models/piano_transcription.onnx
          ls -la app/src/main/assets/models

      - name: Build the debug app and test APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - uses: actions/download-artifact@v4
        with:
          name: release-apk-for-tests
          path: PianoScribe/release-apk

      - name: Run on an Android ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: PianoScribe
          script: |
            adb logcat -c
            ./gradlew --no-daemon connectedDebugAndroidTest || (adb logcat -d > logcat-tests.txt; touch tests-failed)
            adb logcat -d -s PianoScribeTest:I | tail -20
            adb install -r release-apk/*.apk
            adb logcat -c
            adb shell am start -W -n com.pianoscribe.app/.MainActivity
            sleep 10
            adb logcat -d > logcat-release.txt
            adb shell pidof com.pianoscribe.app || (echo "Release app is not running after launch"; grep -A30 "FATAL EXCEPTION" logcat-release.txt; exit 1)
            if grep -q "FATAL EXCEPTION" logcat-release.txt; then grep -A30 "FATAL EXCEPTION" logcat-release.txt; exit 1; fi
            echo "Release APK launched and is running"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash scripts/release-import-check.sh test_melody.mp3
            bash scripts/release-import-check.sh test_melody.m4a
            test ! -f tests-failed

      - name: Show failed device tests in full
        if: failure()
        working-directory: PianoScribe
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in tc.findall("failure"):
                      print(f"FAILED {tc.get('classname')}.{tc.get('name')}")
                      print("\n".join((fail.text or "").splitlines()[:60]))
          PY
          test -f logcat-tests.txt && grep -B2 -A40 "FATAL EXCEPTION\|performMeasureAndLayout" logcat-tests.txt | head -150 || true

      - name: Upload test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PianoScribe-device-test-reports-api${{ matrix.api-level }}
          path: |
            PianoScribe/app/build/reports/androidTests/
            PianoScribe/app/build/outputs/androidTest-results/
            PianoScribe/logcat-*.txt
            PianoScribe/ui.xml

  # Publishes only after the app has passed the device tests.
  release:
    needs: [build, device-tests]
    if: startsWith(github.ref, 'refs/tags/pianoscribe-v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PianoScribe-apks
          path: dist

      - name: Publish GitHub Release (pianoscribe-v* tags or manual release_tag)
        if: startsWith(github.ref, 'refs/tags/pianoscribe-v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: PianoScribe ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/PianoScribe-release.apk
            dist/PianoScribe-debug.apk
