name: Build Android APK

on:
  push:
    branches: [apk-build, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          # camera access for "Take photo" in the question solver
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GATE-EE-Papers.apk"
          ls -lh "$GITHUB_WORKSPACE/GATE-EE-Papers.apk"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GATE-EE-Papers-apk
          path: GATE-EE-Papers.apk

      - name: Publish APK as a GitHub Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GATE EE Papers APK (build ${{ github.run_number }})
          body: |
            Install on Android: download GATE-EE-Papers.apk on your phone, open it, and allow "Install unknown apps" for your browser/files app when asked.
            This is a debug-signed build for personal use.
          files: GATE-EE-Papers.apk
          make_latest: true
